name: Skill Linter

on:
  pull_request:
    paths:
      - "skills/**"
      - "projects/**"
      - "scripts/skill_linter.py"
      - ".github/workflows/skill-lint.yml"
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python scripts
        run: python3 -m py_compile skills/aws/cloudtrail/*/scripts/*.py
      - name: Run skill linter
        run: python3 scripts/skill_linter.py
