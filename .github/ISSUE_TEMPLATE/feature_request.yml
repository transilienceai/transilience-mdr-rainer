name: Feature Request
description: Suggest a new MDR workflow, cloud provider, detector, or report improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Share the operational problem and the MDR outcome you want. Avoid customer-confidential examples.
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - AWS CloudTrail workflow
        - New AWS service coverage
        - Detection engineering
        - Evidence packaging
        - Reporting
        - New cloud provider
        - Documentation
        - Developer experience
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: contribution
    attributes:
      label: Contribution
      options:
        - "Yes, I'd like to submit a PR"
        - "I can help but need guidance"
        - "No, just suggesting"
    validations:
      required: true
